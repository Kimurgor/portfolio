# Permalinks configuration for portfolio pages
[permalinks]
  portfolio = '/portfolio/:slug/'

[related]
  threshold = 1
  toLower = true
  includeNewer = true

[[related.indices]]
  name = "categories"
  weight = 100

[taxonomies]
    category = "categories"
    tags = "tags"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
  
   [[menu.main]]
    name = "Logo"
    url = "/logo/"
    weight = 30

   [[menu.main]]
